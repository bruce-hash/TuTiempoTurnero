# Apache mínimo para probar el .htaccess real (Bloque B): el mismo dist/ que se sube a Hostinger, con AllowOverride All.
# Sirve igual en el contenedor httpd:2.4 del CI y en un apache2 local. Se le pasan con -C antes de leer este archivo:
#   Define MODDIR  carpeta de los módulos (httpd:2.4: /usr/local/apache2/modules · Ubuntu: /usr/lib/apache2/modules)
#   Define DOCROOT carpeta web (el dist/)     Define CERTS carpeta con tt.crt y tt.key (autofirmado)
#   Define RUNDIR  carpeta para pid y logs    Define RUNUSER / RUNGROUP usuario con el que corre
ServerRoot "${RUNDIR}"
ServerName localhost
Listen 8080
Listen 8443
PidFile "${RUNDIR}/httpd.pid"
ErrorLog "${RUNDIR}/error.log"
LogLevel warn
User ${RUNUSER}
Group ${RUNGROUP}

LoadModule mpm_event_module "${MODDIR}/mod_mpm_event.so"
LoadModule authz_core_module "${MODDIR}/mod_authz_core.so"
LoadModule dir_module "${MODDIR}/mod_dir.so"
LoadModule mime_module "${MODDIR}/mod_mime.so"
LoadModule headers_module "${MODDIR}/mod_headers.so"
LoadModule rewrite_module "${MODDIR}/mod_rewrite.so"
LoadModule deflate_module "${MODDIR}/mod_deflate.so"
LoadModule filter_module "${MODDIR}/mod_filter.so"
LoadModule ssl_module "${MODDIR}/mod_ssl.so"
<IfModule !unixd_module>
  LoadModule unixd_module "${MODDIR}/mod_unixd.so"
</IfModule>
<IfModule !socache_shmcb_module>
  LoadModule socache_shmcb_module "${MODDIR}/mod_socache_shmcb.so"
</IfModule>

TypesConfig /dev/null
AddType text/html .html
AddType text/css .css
AddType text/plain .txt
AddType image/svg+xml .svg
AddType image/png .png
SSLSessionCache "shmcb:${RUNDIR}/ssl_scache(512000)"

DocumentRoot "${DOCROOT}"
<Directory />
  AllowOverride None
  Require all denied
</Directory>
<Directory "${DOCROOT}">
  AllowOverride All
  Require all granted
</Directory>

<VirtualHost *:8080>
  DocumentRoot "${DOCROOT}"
</VirtualHost>
<VirtualHost *:8443>
  DocumentRoot "${DOCROOT}"
  SSLEngine on
  SSLCertificateFile "${CERTS}/tt.crt"
  SSLCertificateKeyFile "${CERTS}/tt.key"
</VirtualHost>
